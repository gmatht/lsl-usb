name: CI

on:
  push:
  pull_request:

jobs:
  pwsh-tests:
    name: PowerShell harness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run install.ps1 test harness
        shell: pwsh
        run: pwsh -NoProfile -File tests/install.ps1.tests.ps1

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -e
          for f in build.sh onboot.sh bin/*.sh bin/uproot bin/detect-wsl bin/lsl misc/lsl-firstboot.sh; do
            [ -f "$f" ] || continue
            shellcheck -S warning "$f"
          done

  z0-freshness:
    name: Embedded z0 layer freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Verify the embedded z0 layer matches misc/ (WHYFAIL10)
        # rust9x/lslsetup embeds assets/filesystem.z0.squashfs (include_bytes!),
        # so cargo depends on the blob, not on the misc/ sources it is packed
        # from - editing misc/ without regenerating would reship a stale
        # firstboot layer. build.rs enforces this at build time; this is the
        # byte-accurate gate (same check build.sh runs before packaging).
        run: bash misc/check-z0-freshness.sh "$PWD"

      - name: Verify the embedded firstboot toolkit matches bin/ (WHYFAIL13 follow-up)
        # src/lslfiles.rs include_str!s 36 repo files into FIRSTBOOT_TOOLKIT and
        # the nofmt installer writes the stick's /cdrom from that array alone. A
        # committed/prebuilt exe keeps whatever those files held when it was
        # COMPILED, so a fix in bin/ can sit unshipped - on 2026-10-01 every
        # shipped lslsetup.exe still embedded the broken bin/lsl-pin-favorites.
        # build.rs enforces assets/toolkit_sources.sha256; this is the same gate
        # build.sh runs before packaging (no external tools required).
        run: bash misc/check-toolkit-freshness.sh "$PWD"

  bats:
    name: Bash tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        # test 29 runs the real build.sh: it hard-requires mksquashfs/zip
        # (plus unzip/cpio further down) - install the same set as Build bundle.
        run: sudo apt-get update && sudo apt-get install -y bats squashfs-tools zip unzip cpio
      - name: Run bats
        run: bats tests/bash.tests.bats

  build:
    name: Build bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        # unzip/cpio are hard requirements of build.sh's verify/initrd steps;
        # installing (not assuming preinstalled) keeps both bundle-building
        # jobs hermetic.
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools zip unzip cpio
      - name: Run build.sh
        run: ./build.sh
      - name: Verify artifacts
        run: |
          test -f dist/lsl-usb-win.zip
          test -f dist/filesystem_z0_firstboot.squashfs
          unzip -l dist/lsl-usb-win.zip | grep -q install.ps1
          unzip -l dist/lsl-usb-win.zip | grep -q filesystem_z0_firstboot.squashfs
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: lsl-usb-win
          path: dist/lsl-usb-win.zip

# NOTE: publishing owns to release.yml (it has contents:write and ships
# both the bundle and the Rust exe). This workflow intentionally has no
# release job: an earlier one 403'd under default token permissions and
# duplicated release.yml, racing it on every tag.
