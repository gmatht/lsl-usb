[package]
name = "lslsetup"
version = "0.1.0"
edition = "2024"

# Full reimplementation of lsl-usb's install.ps1 as a native Windows
# executable. Built with the rust9x toolchain (i686-rust9x-windows-msvc) so
# the same binary runs on Windows 95 -> 11; every feature that needs a newer
# Windows is behind a runtime capability check with a graceful fallback.

[dependencies]
native-windows-gui = "1.0"
winapi = { version = "0.3", features = [
    "combaseapi", "consoleapi", "errhandlingapi", "fileapi", "handleapi", "ioapiset", "libloaderapi", "minwinbase", "namedpipeapi", "memoryapi",
    "objbase", "objidl", "processenv", "processthreadsapi", "shellapi",
    "shobjidl", "shobjidl_core", "synchapi", "sysinfoapi", "winbase", "wincon", "winerror", "winioctl",
    "softpub", "winnt", "winreg", "winuser", "wintrust", "impl-default",
] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde_json = "1"

[build-dependencies]
# Host-side only: build.rs re-inflates assets/grldr.gz (gzip -9 + advdef -z -4)
# and verifies the pinned raw SHA-256, so a corrupt/foreign blob fails the
# build instead of shipping a bad bootloader.
flate2 = "1"
sha2 = "0.10"

# Win95-compatible vendored copy of native-windows-gui 1.0.13 (see
# ../nwg-test/vendor/native-windows-gui/README-WIN95.md).
[patch.crates-io]
native-windows-gui = { path = "../nwg-test/vendor/native-windows-gui" }

[profile.dev]
# Unwind support needs at least VC8 (VS2005); we link the VC6 CRT.
panic = "abort"
# The installer hashes gigabytes (SHA-256 copy/verify); unoptimized sha2
# crawls at single-digit MB/s and makes debug installs unusable. O2
# saturates the software implementation (measured equal to O3), so pin just
# this crate and keep fast debug compiles everywhere else.
[profile.dev.package.sha2]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
# No debug info in the shipped EXE (~7 MB saving: debug sections were ~82%
# of the binary). Use a dev build when crash backtraces are needed.
debug = 0
strip = true
opt-level = "z"
# Unwind support needs at least VC8 (VS2005); we link the VC6 CRT.
panic = "abort"
