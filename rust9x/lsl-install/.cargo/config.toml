# rust9x build configuration (modeled on https://github.com/rust9x/rust9x-sample)
#
# Build with:  cargo +rust9x build --target i686-rust9x-windows-msvc
#
# Library paths are scoped per-target:
#   - rust9x targets use the VINTAGE toolset: Windows SDK v7.1A import libs
#     (+ unicows.lib) and the VC6 (MSVC 6.0) static CRT — the most compatible
#     combo (Win95+/NT3.5+; docs note VC6 needs panic="abort" + /SAFESEH:NO).
#   - regular msvc targets (cargo check --target i686-pc-windows-msvc, etc.)
#     are unaffected; modern VS2022/Win10-SDK LIBPATHs are listed commented-out.

[unstable]
# build-std keeps binaries small (only include what you use). It requires the
# `rust-src` component, which the rust9x release tarballs do NOT bundle — the
# precompiled std for the rust9x targets is included though, so this is off by
# default. If you install rust-src, uncomment these two lines:
# build-std = ["std"]
# build-std-features = ["backtrace", "optimize_for_size"]

[build]

[target.'cfg(all(target_env = "msvc"))']
linker = "rust-lld"

[target.'cfg(all(target_family = "rust9x", target_env = "msvc"))']
rustflags = [
  # Console subsystem, version 4.0 (Windows 95 and up, NT3.5 and up). This
  # installer is console-first (GUI dialogs still work from a console app).
  '-Clink-arg=/SUBSYSTEM:CONSOLE,4.0',
  '-Clink-arg=/OSVERSION:3.1',         # set OS version to 3.1 to work anywhere

  # (NOTE: NT3.51 does _not_ like a 1MiB stack and will promptly ignore it)
  '-Clink-arg=/STACK:131072', # 128KiB stack

  '-Ctarget-feature=+crt-static', # statically linked runtime

  ############# Add search paths for import libraries

  # Windows SDK v7.1A import libraries (incl. unicows.lib, ws2_32.lib).
  # Listed first so import libs resolve here, while CRT libs fall through to
  # the VC6 path (the SDK ships no CRT libs). Lowercase symlinks were added
  # because lld looks up e.g. "kernel32.lib" verbatim on a case-sensitive fs.
  '-Clink-arg=/LIBPATH:/opt/msvc-toolchains/sdk71a/Lib',

  # VC6 (MSVC 6.0) static CRT (libcmt.lib): Win95+/NT3.5+, no unwinding
  # (panic = "abort" is set in Cargo.toml), no SAFESEH -> see /SAFESEH:NO.
  '-Clink-arg=/LIBPATH:/opt/msvc-toolchains/vc6/VC98Lib',

  # VC6-era CRT doesn't support SAFESEH (rustc passes /SAFESEH for i686)
  '-Clink-arg=/SAFESEH:NO',

  # Application manifest (asInvoker: opt out of the UAC installer-detection
  # heuristic that auto-elevates *install*.exe; dpiAware; supportedOS).
  # Compiled once with: llvm-rc /FO src/app_manifest.res src/app_manifest.rc
  '-Clink-arg=/root/src/lsl-usb/rust9x/lsl-install/src/app_manifest.res',

  # Stub libs for modern /DEFAULTLIB markers emitted by rust9x's std
  # (windows_link references synchronization.lib but resolves
  # WaitOnAddress dynamically at runtime - nothing is imported from it).
  # Must come LAST so real libraries always win.
  '-Clink-arg=/LIBPATH:/opt/msvc-toolchains/stubs',
]

# Modern libs, ONLY if you ever link a standard (non-rust9x) msvc target here:
# [target.'cfg(all(target_env = "msvc", not(target_family = "rust9x")))']
# rustflags = [
#   '-Clink-arg=/LIBPATH:/mnt/c/Program Files/Microsoft Visual Studio/2022/Community/VC/Tools/MSVC/14.44.35207/lib/x86',
#   '-Clink-arg=/LIBPATH:/mnt/c/Program Files (x86)/Windows Kits/10/Lib/10.0.22000.0/um/x86',
#   '-Clink-arg=/LIBPATH:/mnt/c/Program Files (x86)/Windows Kits/10/Lib/10.0.22000.0/ucrt/x86',
# ]
