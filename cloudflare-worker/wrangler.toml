name = "lsl-usb-reports-api"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "lsl-usb-reports"
database_id = "f716a611-fa2d-4366-8606-03d5645a6fb5"

# Partition-layout KeyVal store (F2FS safety net). Create once with:
#   wrangler kv namespace create lsl-usb-layouts
# then replace the PLACEHOLDER id below with the printed `id`
# (preview_id is for `wrangler dev`). Without this binding the /kv
# routes answer 500 "KeyVal store not configured" and Past Layouts
# shows nothing - the worker still deploys and /report keeps working.
[[kv_namespaces]]
binding = "PARTITION_KV"
id = "PLACEHOLDER-run-wrangler-kv-namespace-create-lsl-usb-layouts"
