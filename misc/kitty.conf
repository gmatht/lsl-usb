# kitty.conf - LSL-USB terminal, tuned to feel like Windows Terminal.
# Installed to the desktop user's ~/.config/kitty/kitty.conf (see bin/config.sh).
# Edit freely; changes persist on HDD mode (home.btrfs) or via uphome (USB mode).

# --- Layout (matches Windows Terminal defaults) ---
# Generous padding like WT's default 8px-ish gutter.
padding_left 8
padding_right 8
padding_top 8
padding_bottom 8

# Scrollback parity with WT's default (≈9001 lines feels unlimited).
scrollback_lines 10000
scrollback_pager_history_size 10000

# --- Font (Cascadia Code is WT's default; falls back gracefully) ---
font_family      Cascadia Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Windows Terminal default is "Consolas"/"Cascadia Code" with subpixel AA.
font_subpixel_antialias yes
# Don't scale by DPI (WT treats 11pt as 11pt); keep predictable across monitors.
remember_window_size no
initial_window_width 950
initial_window_height 600

# --- Colors (Windows Terminal "Campbell" palette) ---
background #0C0C0C
foreground #CCCCCC
selection_background #1F1F1F
selection_foreground #FFFFFF

# Campbell-ish 16-color ANSI ramp (WT's default dark theme).
color0   #0C0C0C
color1   #C50F1F
color2   #13A10E
color3   #C19C00
color4   #0037DA
color5   #881798
color6   #3A96DD
color7   #CCCCCC
color8   #767676
color9   #E74856
color10  #16C60C
color11  #F9F1A5
color12  #3B78FF
color13  #B4009E
color14  #61D6D6
color15  #F2F2F2

# Cursor like WT (filled block, visible).
cursor #FFFFFF
cursor_text_color #0C0C0C
cursor_shape block
cursor_blink_interval 0

# --- Behavior ---
# WT users expect Ctrl+Shift+C / +V to copy/paste.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# WT-style new-tab / close-tab / next-tab.
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
# Zoom like WT (ctrl +/-).
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+zero change_font_size all 0

# Mouse selection copies on release; middle-click pastes.
copy_on_select no
strip_trailing_spaces smart

# Tab bar (WT shows it by default).
tab_bar_style fade
tab_powerline_style no
active_tab_title_format " {title} "

# Bell off by default (WT is silent).
enable_audio_bell no

# Start in the working dir; allow remote control for the GUI wrappers.
allow_remote_control yes
