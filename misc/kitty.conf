# kitty.conf - LSL-USB terminal, tuned to feel like Windows Terminal.
# Installed to the desktop user's ~/.config/kitty/kitty.conf (see bin/config.sh).
# Edit freely; changes persist on HDD mode (home.btrfs) or via uphome (USB mode).
#
# NOTE: kitty REJECTS the whole config (and refuses to start, printing
# "The value ... is not a valid choice ...") when an option value is invalid,
# and silently drops unknown keys. Keep this file to keys that exist in kitty
# and values from their documented choice lists, or kitty can stop launching
# with no window at all.

# --- Layout (matches Windows Terminal defaults) ---
# Generous padding like WT's default 8px-ish gutter.
# kitty has no per-side padding keys; one edge-width value covers all four
# sides (or use "window_padding_width <v> <h>" for vertical/horizontal).
window_padding_width 8

# Scrollback parity with WT's default (≈9001 lines feels unlimited).
scrollback_lines 10000
scrollback_pager_history_size 10000

# --- Font (Cascadia Code is WT's default; falls back gracefully) ---
font_family      Cascadia Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Don't scale by DPI (WT treats 11pt as 11pt); keep predictable across monitors.
remember_window_size no
initial_window_width 950
initial_window_height 600

# --- Colors (Windows Terminal "Campbell" palette) ---
background #0C0C0C
foreground #CCCCCC
selection_background #1F1F1F
selection_foreground #FFFFFF

# Campbell-ish 16-color ANSI ramp (WT's default dark theme).
color0   #0C0C0C
color1   #C50F1F
color2   #13A10E
color3   #C19C00
color4   #0037DA
color5   #881798
color6   #3A96DD
color7   #CCCCCC
color8   #767676
color9   #E74856
color10  #16C60C
color11  #F9F1A5
color12  #3B78FF
color13  #B4009E
color14  #61D6D6
color15  #F2F2F2

# Cursor like WT (filled block, visible).
cursor #FFFFFF
cursor_text_color #0C0C0C
cursor_shape block
cursor_blink_interval 0

# --- Behavior ---
# WT users expect Ctrl+Shift+C / +V to copy/paste.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# WT-style new-tab / close-tab / next-tab.
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
# Zoom like WT (ctrl +/-/0). kitty spells the zero key "0", not "zero".
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Mouse selection copies on release; middle-click pastes.
copy_on_select no
strip_trailing_spaces smart

# Tab bar (WT shows it by default). tab_powerline_style only applies when
# tab_bar_style is "powerline" (WT-like fade is chosen here), so it is not set:
# kitty's only valid values are angled/round/slanted and "no" is fatal.
tab_bar_style fade
active_tab_title_template " {title} "

# Bell off by default (WT is silent).
enable_audio_bell no

# Start in the working dir; allow remote control for the GUI wrappers.
allow_remote_control yes
